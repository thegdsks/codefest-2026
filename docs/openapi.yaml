      responses:
        '200':
          description: Metrics snapshot returned.
          content:
            application/json:
              schema:
                type: object
                required: [correlationId, data]
                properties:
                  correlationId:
                    type: string
                  data:
                    $ref: '#/components/schemas/AdminMetrics'
        '400':
          description: Invalid window parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid gateway Basic Auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Basic Auth subject is not in ADMIN_USERNAMES.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------------------------
  # Admin - Release
  # ----------------------------------------------------------------------------

  /admin/decisions/{id}/release:
    post:
      operationId: adminReleaseDecision
      summary: Override a blocked decision and unblock the user
      description: >
        Looks up the original decision by decisionId, writes a DECISION_RELEASE
        row, and sets UserState.isBlocked to false for the affected user.

        The id path parameter is the full decisionId value (e.g. DEC#1716211200000).
        URL-encode the # as %23 in the path.
      x-internal-only: true
      parameters:
        - name: id
          in: path
          required: true
          description: >
            The decisionId of the HOLD or BLOCK decision to release.
            URL-encode # as %23 (e.g. DEC%231716211200000).
          schema:
            type: string
            example: DEC%231716211200000
      responses:
        '200':
          description: Decision released and user unblocked.
          content:
            application/json:
              schema:
                type: object
                required: [correlationId, data]
                properties:
                  correlationId:
                    type: string
                  data:
                    type: object
                    required: [released, originalDecisionId, releasedAt]
                    properties:
                      released:
                        type: boolean
                        example: true
                      originalDecisionId:
                        type: string
                        example: 'DEC#1716211200000'
                      releasedAt:
                        type: integer
                        description: Unix epoch seconds when the release was written.
                        example: 1716214800
        '400':
          description: Missing or invalid id path parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid gateway Basic Auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Basic Auth subject is not in ADMIN_USERNAMES.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Decision not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                correlationId: ''
                error:
                  code: NOT_FOUND
                  message: 'Decision not found: DEC#1716211200000'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------------------------
  # Admin - Users
  # ----------------------------------------------------------------------------

  /admin/users:
    get:
      operationId: adminGetUsers
      summary: Paginated user list
      description: >
        Returns a page of UserProfile rows with passwordHash stripped. Use the
        nextCursor value from each response as the cursor parameter on the next
        call to advance through the list. When nextCursor is absent the list is
        exhausted.

        The cursor is a base64-encoded DynamoDB LastEvaluatedKey. Its internal
        structure is opaque and subject to change.
      x-internal-only: true
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Capped at 100. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: >
            Pagination cursor from the nextCursor field of a previous response.
            Opaque base64-encoded string.
          schema:
            type: string
      responses:
        '200':
          description: User page returned.
          content:
            application/json:
              schema:
                type: object
                required: [correlationId, data]
                properties:
                  correlationId:
                    type: string
                  data:
                    type: object
                    required: [users, nextCursor]
                    properties:
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserProfile'
                      nextCursor:
                        type: ['string', 'null']
                        description: >
                          Opaque cursor for the next page. Null when the list is
                          exhausted.
                        example: eyJ1c2VySWQiOiJVU0VSIzAxMCJ9
        '400':
          description: Invalid cursor value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid gateway Basic Auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Basic Auth subject is not in ADMIN_USERNAMES.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/sessions:
    get:
      operationId: adminGetSessions
      summary: List active bearer-token sessions
      description: >
        Returns ACCESS rows from UserSession. The raw token value is stripped
        from the response so the admin UI never sees it; sessions are
        revoked by sessionId only. Most-recent first by issuedAt.
      parameters:
        - name: userId
          in: query
          required: false
          description: Filter to sessions belonging to this user.
          schema:
            type: string
        - name: active
          in: query
          required: false
          description: 'true to include only non-expired sessions, false for expired.'
          schema:
            type: string
            enum: ['true', 'false']
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        '200':
          description: Session list.
          content:
            application/json:
              schema:
                type: object
                required: [correlationId, data]
                properties:
                  correlationId:
                    type: string
                  data:
                    type: object
                    required: [sessions, count, totalMatched, filters]
                    properties:
                      sessions:
                        type: array
                        items:
                          type: object
                          required: [sessionId, userId, issuedAt, expiresAt, lastActivityAt, mfaVerified, active]
                          properties:
                            sessionId:
                              type: string
                            userId:
                              type: string
                            issuedAt:
                              type: integer
                            expiresAt:
                              type: integer
                            lastActivityAt:
                              type: integer
                            mfaVerified:
                              type: boolean
                            location:
                              type: string
                            ipAddress:
                              type: string
                            deviceId:
                              type: string
                            active:
                              type: boolean
                              description: expiresAt > now
                      count:
                        type: integer
                      totalMatched:
                        type: integer
                      filters:
                        type: object
        '400':
          description: Validation error (invalid `active` value).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/sessions/{sessionId}/revoke:
    post:
      operationId: adminRevokeSession
      summary: Force-revoke a bearer session
      description: >
        Deletes the UserSession row keyed by sessionId. Idempotent 204
        regardless of whether the row existed. URL-decodes the path
        segment so legacy SESSION%23... ids resolve correctly.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Session revoked (or already gone).
        '400':
          description: sessionId missing from path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/mfa-status:
    get:
      operationId: adminGetMfaStatus
      summary: MFA adoption counters across all users
      description: >
        Scans UserProfile and returns total / enrolled / pending /
        notEnrolled counts plus an enrolled percentage. Powers the
        "MFA adoption" tile on the admin dashboard.
      responses:
        '200':
          description: MFA adoption snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [correlationId, data]
                properties:
                  correlationId:
                    type: string
                  data:
                    type: object
                    required: [total, enrolled, pending, notEnrolled, enrolledPercent]
                    properties:
                      total:
                        type: integer
                      enrolled:
                        type: integer
                      pending:
                        type: integer
                      notEnrolled:
                        type: integer
                      enrolledPercent:
                        type: number
                        description: enrolled / total * 100, rounded to one decimal.
        '403':
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health:
    get:
      operationId: health
      summary: Unauthenticated health probe
      description: >
        Returns service version, the commit SHA the Lambda was deployed
        from, and a snapshot of the L2 LLM call-count breaker. No auth
        required.
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, version, commit, engineLayer, asOf]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string
                  commit:
                    type: string
                  engineLayer:
                    type: object
                    required: [breakerOpen, callsInWindow, maxCalls]
                    properties:
                      breakerOpen:
                        type: boolean
                      callsInWindow:
                        type: integer
                      maxCalls:
                        type: integer
                  asOf:
                    type: integer

  # ----------------------------------------------------------------------------
  # Engagement
  # ----------------------------------------------------------------------------

  /engagement/event:
    post:
      operationId: trackEngagementEvent
      summary: Ingest a behavioral signal and evaluate engagement rules
      description: >
        Accepts one of the five signals from the frontend autocapture hook,
        runs the L1 scorer, evaluates active DDB rules, routes through the
        L1+L2 engine (LLM called only for grey-zone scores 40-70), writes a
        DecisionStore row with decisionType=ENGAGEMENT (skipped for ALLOW),
        and returns the surface, copy, and metadata.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signal, userId, sessionId]
              properties:
                signal:
                  $ref: '#/components/schemas/EngagementSignal'
                userId:
                  type: string
                  example: 'USER#001'
                sessionId:
                  type: string
                  example: 'SESSION#a1b2c3d4'
                params:
                  type: object
                  additionalProperties: true
                  example:
                    dwellMs: 9000
                    pointsBalance: 12400
      responses:
        '200':
          description: Event evaluated.
          content:
            application/json:
              schema:
                type: object
                required: [correlationId, data]
                properties:
                  correlationId:
                    type: string
                  data:
                    type: object
                    required: [surface, copy, reasonCode, engineLayer, score, action]
                    properties:
                      surface:
                        $ref: '#/components/schemas/EngagementSurface'
                      copy:
                        type: string
                        example: 'Your 12,400 points can book two nights in Lisbon.'
                      reasonCode:
                        type: string
                        example: POINTS_STARE_HIGH
                      engineLayer:
                        $ref: '#/components/schemas/EngineLayer'
                      score:
                        type: integer
                        minimum: 0
                        maximum: 100
                        example: 82
                      action:
                        type: string
                        enum: [ALLOW, NUDGE, OFFER, HINT]
                      decisionId:
                        type: string
                        nullable: true
                        example: 'DEC#ENG#a1b2c3d4'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------------------------
