  # ----------------------------------------------------------------------------

  /admin/decisions/export:
    get:
      operationId: adminExportDecisions
      summary: Export decision records as JSON or CSV
      description: >
        Returns up to ADMIN_DECISIONS_EXPORT_MAX_ITEMS (default 10000) records
        in json (default) or csv format. Accepts the same window, type, and
        userId filters as GET /admin/decisions.

        When format=csv the response Content-Type is text/csv and the
        Content-Disposition header is set for file download.
      x-internal-only: true
      parameters:
        - $ref: '#/components/parameters/Window'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DecisionType'
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: Response format. Defaults to json.
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Decisions exported.
          content:
            application/json:
              schema:
                type: object
                required: [correlationId, data]
                properties:
                  correlationId:
                    type: string
                  data:
                    type: object
                    required: [decisions, count]
                    properties:
                      decisions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Decision'
                      count:
                        type: integer
            text/csv:
              schema:
                type: string
        '400':
          description: Invalid window or type parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid gateway Basic Auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Basic Auth subject is not in ADMIN_USERNAMES.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/decisions/{id}:
    get:
      operationId: adminGetDecisionById
      summary: Fetch a single decision with audit trail and trace
      description: >
        Returns the full decision row, a synthetic audit trail (one step for
        L1-only decisions, two steps for L1+L2), and a trace object with the
        matched conditions and LLM rationale when available.

        The id is the full decisionId value (e.g. DEC#1716211200000).
        URL-encode # as %23 in the path.
      x-internal-only: true
      parameters:
        - name: id
          in: path
          required: true
          description: Full decisionId. URL-encode # as %23 (e.g. DEC%231716211200000).
          schema:
            type: string
            example: DEC%231716211200000
      responses:
        '200':
          description: Decision found.
          content:
            application/json:
              schema:
                type: object
                required: [correlationId, data]
                properties:
                  correlationId:
                    type: string
                  data:
                    type: object
                    required: [decision, auditTrail]
                    properties:
                      decision:
                        $ref: '#/components/schemas/Decision'
                      auditTrail:
                        type: array
                        items:
                          type: object
                          required: [step]
                          properties:
                            step:
                              type: string
                            score:
                              type: number
                            riskLevel:
                              type: string
                            action:
                              type: string
                            reasonCode:
                              type: string
                            llmModel:
