          description: Rule updated.
          content:
            application/json:
              schema:
                type: object
                required: [correlationId, data]
                properties:
                  correlationId:
                    type: string
                  data:
                    type: object
                    required: [rule]
                    properties:
                      rule:
                        $ref: '#/components/schemas/EngagementRule'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid gateway Basic Auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/rules/ai-suggest:
    post:
      operationId: adminAiSuggestRule
      summary: Generate a draft engagement rule from a natural-language description
      description: >
        Calls the LiteLLM proxy to convert a plain-English description into
        a structured rule draft. The draft is validated against the same
        Zod schema the admin UI uses for the rule editor, but it is NOT
        persisted by this endpoint. The operator reviews the draft and
        then calls POST /admin/rules to save it.
      x-internal-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
                  maxLength: 1000
                  description: Natural-language description of the desired rule.
                  example: 'If a user stares at the points balance for over 8s, show a points-transfer nudge.'
      responses:
        '200':
          description: Rule draft generated.
          content:
            application/json:
              schema:
                type: object
                required: [correlationId, data]
                properties:
                  correlationId:
                    type: string
                  data:
                    $ref: '#/components/schemas/EngagementRuleDraft'
        '400':
          description: Missing or empty description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid gateway Basic Auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: LiteLLM not configured or upstream call failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/rules/test:
    post:
      operationId: adminTestRule
      summary: Count recent ENGAGEMENT decisions a rule would have matched
      description: >
        Evaluates a candidate rule definition against recent decisions in
        DecisionStore and returns the match count plus up to five sample
        rows. Lets an author validate a draft before flipping the rule
        from DRAFT to ACTIVE.
      x-internal-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition:
                  $ref: '#/components/schemas/EngagementRuleDefinition'
                windowSec:
                  type: integer
                  minimum: 1
                  default: 86400
                  description: Lookback window in seconds. Defaults to 24 hours.
      responses:
        '200':
          description: Match count returned.
          content:
            application/json:
              schema:
                type: object
                required: [correlationId, data]
                properties:
                  correlationId:
                    type: string
                  data:
                    type: object
                    required: [count, samples]
                    properties:
                      count:
                        type: integer
                        minimum: 0
                        description: Number of recent ENGAGEMENT rows the rule would have matched.
                      samples:
                        type: array
                        maxItems: 5
                        items:
                          type: object
                          required: [decisionId, signal, userId, timestamp]
                          properties:
                            decisionId:
                              type: string
                              nullable: true
                            signal:
                              type: string
                              nullable: true
                            userId:
                              type: string
                              nullable: true
                            timestamp:
                              type: integer
                              nullable: true
        '400':
          description: Validation error (missing definition or bad windowSec).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid gateway Basic Auth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------------------------
