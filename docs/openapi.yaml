          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      operationId: adminUpdateRule
      summary: Update an existing engagement rule
      x-internal-only: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
