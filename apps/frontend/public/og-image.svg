<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- subtle dot-grid pattern -->
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#27272a"/>
    </pattern>
    <clipPath id="card">
      <rect x="440" y="155" width="320" height="320" rx="40"/>
    </clipPath>
    <!-- glow behind the monogram -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#09090b"/>
  <!-- dot grid texture -->
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- top edge accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="#818cf8"/>

  <!-- ambient glow behind card -->
  <ellipse cx="600" cy="315" rx="300" ry="260" fill="url(#glow)"/>

  <!-- monogram card -->
  <rect x="440" y="155" width="320" height="320" rx="40" fill="#18181b"/>
  <rect x="440" y="155" width="320" height="320" rx="40" fill="none" stroke="#27272a" stroke-width="1.5"/>

  <!-- diagonal slice accent inside card -->
  <polygon points="440,390 760,310 760,335 440,415" fill="#818cf8" opacity="0.90" clip-path="url(#card)"/>

  <!-- SF lettermark inside card -->
  <text
    x="600"
    y="350"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="140"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-6"
  >SF</text>

  <!-- product name -->
  <text
    x="600"
    y="540"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="42"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-1"
  >Signal Force</text>

  <!-- tagline -->
  <text
    x="600"
    y="590"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="22"
    font-weight="400"
    fill="#71717a"
    text-anchor="middle"
    letter-spacing="0.5"
  >Fraud-aware loyalty, decisions you can trust.</text>
</svg>
