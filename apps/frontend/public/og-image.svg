<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#18181b"/>
  <!-- subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="#3b82f6"/>
  <!-- SF wordmark -->
  <text
    x="600"
    y="290"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="160"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-4"
  >Signal Force</text>
  <!-- tagline -->
  <text
    x="600"
    y="370"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="32"
    font-weight="400"
    fill="#a1a1aa"
    text-anchor="middle"
    letter-spacing="1"
  >Fraud-aware loyalty, decisions you can trust.</text>
</svg>
