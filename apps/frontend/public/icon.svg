<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="box">
      <rect width="32" height="32" rx="6"/>
    </clipPath>
  </defs>
  <!-- background -->
  <rect width="32" height="32" rx="6" fill="#09090b"/>
  <!-- diagonal accent slice: a thin parallelogram cutting left-to-right -->
  <polygon points="0,22 32,14 32,17 0,25" fill="#818cf8" opacity="0.85" clip-path="url(#box)"/>
  <!-- SF lettermark bold, white, anchored above the slice -->
  <text
    x="16"
    y="20"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="15"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-0.5"
  >SF</text>
</svg>
