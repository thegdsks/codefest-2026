      aws:cdk:path: signal-force-frontend/SpaBucket/Resource
      cdk_nag:
        rules_to_suppress:
        - reason: Server access logging on the SPA bucket is deferred. CloudFront
            standard logs cover the access path that actually matters for this stack.
          id: AwsSolutions-S1
