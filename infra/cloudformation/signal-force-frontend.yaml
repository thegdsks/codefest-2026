    Metadata:
      aws:cdk:path: signal-force-frontend/Distribution/Origin1/S3OriginAccessControl/Resource
      cdk_nag:
        rules_to_suppress:
        - reason: No geographic restrictions on the demo. Customer surface is open
            to evaluators globally.
          id: AwsSolutions-CFR1
        - reason: WAF in front of CloudFront is documented as post-event work (see
            docs/architecture.md upgrade path).
          id: AwsSolutions-CFR2
        - reason: Standard access logs deferred. Demo traffic is light enough that
