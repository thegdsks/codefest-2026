            Bool:
              aws:SecureTransport: 'false'
          Effect: Deny
          Principal:
            AWS: '*'
          Resource:
          - Fn::GetAtt:
            - SpaBucket48E1059F
            - Arn
          - Fn::Join:
            - ''
            - - Fn::GetAtt:
                - SpaBucket48E1059F
                - Arn
              - /*
        - Action:
          - s3:DeleteObject*
          - s3:GetBucket*
          - s3:List*
          - s3:PutBucketPolicy
          Effect: Allow
          Principal:
            AWS:
              Fn::GetAtt:
              - CustomS3AutoDeleteObjectsCustomResourceProviderRole3B1BD092
              - Arn
          Resource:
          - Fn::GetAtt:
            - SpaBucket48E1059F
            - Arn
          - Fn::Join:
            - ''
            - - Fn::GetAtt:
                - SpaBucket48E1059F
                - Arn
              - /*
        - Action: s3:GetObject
