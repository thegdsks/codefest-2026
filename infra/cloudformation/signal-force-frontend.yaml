            StringEquals:
              AWS:SourceArn:
                Fn::Join:
                - ''
                - - 'arn:'
                  - Ref: AWS::Partition
                  - ':cloudfront::'
                  - Ref: AWS::AccountId
                  - :distribution/
                  - Ref: Distribution830FAC52
          Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Resource:
            Fn::Join:
            - ''
            - - Fn::GetAtt:
                - SpaBucket48E1059F
                - Arn
              - /*
        Version: '2012-10-17'
    Metadata:
      aws:cdk:path: signal-force-frontend/SpaBucket/Policy/Resource
      cdk_nag:
        rules_to_suppress:
        - reason: Server access logging on the SPA bucket is deferred. CloudFront
