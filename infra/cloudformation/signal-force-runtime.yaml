Description: Signal Force - runtime (Lambda, HTTP API, fraud alert, dashboard)
Resources:
  FraudAlertTopic64F9CC35:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: signal-force fraud alerts
      Tags:
      - Key: Project
        Value: signal-force
      - Key: Stage
        Value: dev
    Metadata:
      aws:cdk:path: signal-force-runtime/FraudAlertTopic/Resource
      cdk_nag:
        rules_to_suppress:
        - reason: Demo topic for internal fraud notifications. AWS SDK and Lambda
            publish over TLS by default. SSE will be revisited when the topic carries
            real user data.
          id: AwsSolutions-SNS3
        - reason: Demo topic. KMS-managed encryption deferred until the topic carries
            production payloads.
          id: AwsSolutions-SNS2
  ApiLambdaLogGroup3846CFFB:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 1
      Tags:
      - Key: Project
        Value: signal-force
