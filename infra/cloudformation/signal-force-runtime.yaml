    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Metadata:
      aws:cdk:path: signal-force-runtime/ApiLambdaLogGroup/Resource
  ApiLambdaServiceRole1CC7D0F3:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
      - Fn::Join:
        - ''
        - - 'arn:'
          - Ref: AWS::Partition
          - :iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
      - Key: Project
        Value: signal-force
      - Key: Stage
        Value: dev
    Metadata:
      aws:cdk:path: signal-force-runtime/ApiLambda/ServiceRole/Resource
      cdk_nag:
        rules_to_suppress:
        - reason: Node.js 18 is the documented runtime for this hackathon (see AGENTS.md).
            Bump tracked as post-event work before Lambda EOL.
          id: AwsSolutions-L1
        - reason: AWSLambdaBasicExecutionRole is the CDK default for Lambda CloudWatch
            Logs access and is acceptable.
          id: AwsSolutions-IAM4
          applies_to:
          - Policy::arn:<AWS::Partition>:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - reason: GSI wildcards are required by Table.grantReadWriteData so the function
            can query the indexes attached to each table.
          id: AwsSolutions-IAM5
          applies_to:
          - Resource::<UserProfileTable61BB5480.Arn>/index/*
          - Resource::<UserSessionTableCD18DD22.Arn>/index/*
          - Resource::<DecisionStoreTable3E281CE6.Arn>/index/*
        - reason: Bedrock foundation-model and inference-profile ARNs use a model-family
            wildcard so the function works across Haiku 4.5 minor versions without
            redeploy.
          id: AwsSolutions-IAM5
          applies_to:
          - Resource::arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5*
          - Resource::arn:aws:bedrock:*:*:inference-profile/us.anthropic.claude-haiku-4-5*
        - reason: 'X-Ray PutTraceSegments and PutTelemetryRecords cannot be scoped
            to specific resource ARNs (AWS docs require Resource: *). Enabled by lambda.Tracing.ACTIVE
            so the runtime function appears in X-Ray traces.'
          id: AwsSolutions-IAM5
          applies_to:
          - Resource::*
  ApiLambdaServiceRoleDefaultPolicyF1B57697:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
        - Action:
          - xray:PutTelemetryRecords
          - xray:PutTraceSegments
          Effect: Allow
          Resource: '*'
        - Action:
          - dynamodb:BatchGetItem
          - dynamodb:BatchWriteItem
          - dynamodb:ConditionCheckItem
          - dynamodb:DeleteItem
          - dynamodb:DescribeTable
          - dynamodb:GetItem
          - dynamodb:GetRecords
          - dynamodb:GetShardIterator
          - dynamodb:PutItem
          - dynamodb:Query
          - dynamodb:Scan
          - dynamodb:UpdateItem
          Effect: Allow
          Resource:
          - Fn::ImportValue: signal-force-dynamodb:ExportsOutputFnGetAttDecisionStoreTable3E281CE6Arn70033280
          - Fn::ImportValue: signal-force-dynamodb:ExportsOutputFnGetAttEngagementRulesTableE2AC6BE6Arn143A6038
          - Fn::ImportValue: signal-force-dynamodb:ExportsOutputFnGetAttUserActivityTableC1B8BF25Arn5B2CBB62
          - Fn::ImportValue: signal-force-dynamodb:ExportsOutputFnGetAttUserProfileTable61BB5480Arn8F33ED73
          - Fn::ImportValue: signal-force-dynamodb:ExportsOutputFnGetAttUserSessionTableCD18DD22Arn426FD013
          - Fn::ImportValue: signal-force-dynamodb:ExportsOutputFnGetAttUserStateTable339B87E4Arn69FBB1B1
          - Fn::Join:
            - ''
            - - Fn::ImportValue: signal-force-dynamodb:ExportsOutputFnGetAttDecisionStoreTable3E281CE6Arn70033280
              - /index/*
          - Fn::Join:
            - ''
            - - Fn::ImportValue: signal-force-dynamodb:ExportsOutputFnGetAttUserProfileTable61BB5480Arn8F33ED73
              - /index/*
          - Fn::Join:
            - ''
            - - Fn::ImportValue: signal-force-dynamodb:ExportsOutputFnGetAttUserSessionTableCD18DD22Arn426FD013
              - /index/*
        - Action: sns:Publish
          Effect: Allow
          Resource:
            Ref: FraudAlertTopic64F9CC35
        - Action:
          - bedrock:Converse
          - bedrock:InvokeModel
          Effect: Allow
          Resource:
          - arn:aws:bedrock:*:*:inference-profile/us.anthropic.claude-haiku-4-5*
          - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5*
          Sid: BedrockHaikuAccess
        Version: '2012-10-17'
      PolicyName: ApiLambdaServiceRoleDefaultPolicyF1B57697
      Roles:
