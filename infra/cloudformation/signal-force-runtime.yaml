        - reason: AWSLambdaBasicExecutionRole is the CDK default for Lambda CloudWatch
            Logs access and is acceptable.
          id: AwsSolutions-IAM4
          applies_to:
          - Policy::arn:<AWS::Partition>:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - reason: GSI wildcards are required by Table.grantReadWriteData so the function
            can query the indexes attached to each table.
          id: AwsSolutions-IAM5
          applies_to:
          - Resource::<UserProfileTable61BB5480.Arn>/index/*
          - Resource::<UserSessionTableCD18DD22.Arn>/index/*
          - Resource::<DecisionStoreTable3E281CE6.Arn>/index/*
        - reason: Bedrock foundation-model and inference-profile ARNs use a model-family
            wildcard so the function works across Haiku 4.5 minor versions without
            redeploy.
          id: AwsSolutions-IAM5
          applies_to:
          - Resource::arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5*
          - Resource::arn:aws:bedrock:*:*:inference-profile/us.anthropic.claude-haiku-4-5*
        - reason: 'X-Ray PutTraceSegments and PutTelemetryRecords cannot be scoped
            to specific resource ARNs (AWS docs require Resource: *). Enabled by lambda.Tracing.ACTIVE
            so the runtime function appears in X-Ray traces.'
          id: AwsSolutions-IAM5
          applies_to:
